<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Product Enquiry</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        .header {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #cbd5e1;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            gap: 30px;
        }

        .contact-info,
        .contact-form {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .contact-info {
            flex: 1;
        }

        .contact-form {
            flex: 1.5;
        }

        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .info-item {
            margin: 20px 0;
        }

        .info-item h3 {
            color: #334155;
            margin-bottom: 5px;
        }

        .info-item p {
            color: #64748b;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            color: #334155;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Contact Us</h1>
        <p>Have a question about our product? Send us an enquiry.</p>
    </div>

    <div class="container">

        <!-- Contact Information -->
        <div class="contact-info">
            <h2>Product Enquiry</h2>

            <div class="info-item">
                <h3>📧 Email</h3>
                <p>support@example.com</p>
            </div>

            <div class="info-item">
                <h3>📞 Phone</h3>
                <p>+91 98765 43210</p>
            </div>

            <div class="info-item">
                <h3>📍 Address</h3>
                <p>Ghaziabad, Uttar Pradesh, India</p>
            </div>

            <div class="info-item">
                <h3>⏰ Working Hours</h3>
                <p>Monday - Saturday</p>
                <p>9:00 AM - 6:00 PM</p>
            </div>
        </div>

        <!-- Enquiry Form -->
        <div class="contact-form">
            <h2>Send an Enquiry</h2>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number">

                <label for="product">Select Product</label>
                <select id="product" required>
                    <option value="">-- Select Product --</option>
                    <option>Product 1</option>
                    <option>Product 2</option>
                    <option>Product 3</option>
                    <option>Other</option>
                </select>

                <label for="message">Your Enquiry</label>
                <textarea id="message" placeholder="Write your enquiry or question here..." required></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </div>

    </div>

    <footer>
        © 2026 Your Company. All Rights Reserved.
    </footer>

</body>

</html>
